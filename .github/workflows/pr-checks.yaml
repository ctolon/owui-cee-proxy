name: pr-checks

# Extra checks gating PR-to-main merges:
#   1. PR title must follow Conventional Commits — squash-merge titles
#      drive semver in the release workflow, so this is critical.
#   2. Quick security pre-flight (gosec + govulncheck + trivy fs).
#      The full security workflow still runs post-merge / on demand.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  statuses: write

env:
  GO_VERSION: "1.26.3"

jobs:
  pr-title:
    name: conventional commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed types — extend as needed. PR titles like
          #   feat(engine): add MinerU adapter
          #   fix(ssrf): close DNS rebind window
          #   chore(deps): bump golangci-lint
          # are valid; "feat!:" or "BREAKING CHANGE:" in the body bumps major.
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[A-Za-z].+$
          subjectPatternError: |
            The PR title subject "{subject}" must start with a letter and
            be a non-empty short description. Example: "feat(engine):
            add MinerU adapter".

  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # Install gosec via `go install` so it builds with the workflow's
      # toolchain. The Docker-based securego/gosec action ships its own
      # Go runtime with GOTOOLCHAIN=local, which trips when go.mod's
      # `go` directive (1.26.3) is newer than its baked-in Go (1.26.2).
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Run gosec
        run: gosec -severity medium -confidence medium ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -show=verbose ./...

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
