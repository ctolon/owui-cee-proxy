name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.26.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # golangci-lint v2 requires the v7 action; the v6 action explicitly
      # rejects v2.x with "golangci-lint v2 is not supported by
      # golangci-lint-action v6".
      #
      # install-mode: goinstall compiles golangci-lint from source with
      # the workflow's setup-go toolchain (Go 1.26.1), avoiding the
      # "binary built with go1.24 is lower than targeted 1.26.1"
      # rejection that the pre-built binary mode triggers.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.0.2
          install-mode: goinstall
          args: --timeout=10m

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod download
      - run: go test -race -count=1 -coverprofile=cov.out ./...
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cov.out

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -o bin/owui-cee-proxy ./cmd/proxy

  helm-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - run: helm lint deployments/helm/owui-cee-proxy
      - run: helm template owui-cee-proxy deployments/helm/owui-cee-proxy > /tmp/render.yaml
      # instrumenta/kubeval-action is gone; kubeval itself is
      # unmaintained. Use kubeconform (its modern successor). We
      # tolerate "schema not found" so Gateway API HTTPRoute and
      # ServiceMonitor CRDs do not gate the lint.
      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: kubeconform on rendered chart
        run: |
          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -summary \
            /tmp/render.yaml

  manifests-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: Build + validate ingress-nginx overlay
        run: |
          kustomize build deployments/kubernetes/overlays/ingress-nginx > /tmp/ing.yaml
          kubeconform -strict -ignore-missing-schemas -summary /tmp/ing.yaml
      - name: Build + validate gateway-api-envoy overlay
        run: |
          kustomize build deployments/kubernetes/overlays/gateway-api-envoy > /tmp/gw.yaml
          kubeconform -strict -ignore-missing-schemas -summary /tmp/gw.yaml
