name: ci

# Triggers
#   - push to dev: fast feedback for in-flight work
#   - PR to main / dev: gate every merge with the same suite
# Direct push to main is blocked by branch protection
# (see .github/rulesets/main.json); the release workflow takes over
# once a PR lands on main.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: read

env:
  GO_VERSION: "1.26.3"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # golangci-lint v2 requires the v7 action; install-mode=goinstall
      # builds the linter with the workflow's setup-go toolchain so the
      # "go version too low" guard against go.mod 1.26 doesn't trip.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          install-mode: goinstall
          args: --timeout=10m

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod download
      - run: go test -race -count=1 -coverprofile=cov.out ./...
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: cov.out

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -o bin/owui-cee-proxy ./cmd/proxy

  helm-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - run: helm lint deployments/helm/owui-cee-proxy
      - run: helm template owui-cee-proxy deployments/helm/owui-cee-proxy > /tmp/render.yaml
      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: kubeconform on rendered chart
        run: |
          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -summary \
            /tmp/render.yaml

  manifests-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Install kustomize
        run: |
          KUSTOMIZE_VERSION=v5.5.0
          URL="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o k.tar.gz "$URL"
          tar -xzf k.tar.gz kustomize
          sudo mv kustomize /usr/local/bin/
          kustomize version
      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: Build + validate ingress-nginx overlay
        run: |
          kustomize build deployments/kubernetes/overlays/ingress-nginx > /tmp/ing.yaml
          kubeconform -strict -ignore-missing-schemas -summary /tmp/ing.yaml
      - name: Build + validate gateway-api-envoy overlay
        run: |
          kustomize build deployments/kubernetes/overlays/gateway-api-envoy > /tmp/gw.yaml
          kubeconform -strict -ignore-missing-schemas -summary /tmp/gw.yaml
