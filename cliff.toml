# git-cliff configuration — drives CHANGELOG.md generation.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project are documented here. Each entry
is grouped by version and section. The source-of-truth for any one
release's verbose notes is the merged PR body on GitHub:
https://github.com/ctolon/owui-cee-proxy/releases

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/)
and the project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
  {% if commit.breaking %} — **BREAKING**{% endif %}\
{% endfor %}
{% endfor %}
"""
trim = true
footer = "<!-- generated by git-cliff -->"

[git]
conventional_commits  = true
filter_unconventional = true
split_commits         = false
commit_parsers = [
  { message = "^feat",     group = "Features"            },
  { message = "^fix",      group = "Bug Fixes"           },
  { message = "^perf",     group = "Performance"         },
  { message = "^refactor", group = "Refactor"            },
  { message = "^docs",     group = "Documentation"       },
  { message = "^test",     group = "Tests", skip = true  },
  { message = "^build",    group = "Build", skip = true  },
  { message = "^ci",       group = "CI",   skip = true   },
  { message = "^chore\\(release\\)", skip = true         },
  { message = "^chore",    group = "Chores", skip = true },
  { message = "^revert",   group = "Reverts"             },
]
filter_commits = false
tag_pattern    = "v[0-9]*"
ignore_tags    = ""
topo_order     = false
sort_commits   = "newest"
