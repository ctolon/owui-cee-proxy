version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - integration

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nilerr
    - noctx
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tparallel
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    gocyclo:
      min-complexity: 18
    gosec:
      excludes:
        - G404 # math/rand is fine for non-crypto helpers in tests
        - G101 # env var NAMES (e.g., "PROXY_API_KEYS") are not credentials
        - G304 # spool path is server-controlled, not user-tainted
    revive:
      rules:
        - name: var-naming
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true
    errorlint:
      errorf: true
      asserts: true
      comparison: true
  exclusions:
    rules:
      # Test files use test-only ergonomics (http.Post, httptest.NewRequest,
      # net.Listen, etc.) that the production lints would otherwise reject.
      # We trust the test author to keep these focused.
      - path: _test\.go
        linters:
          - bodyclose
          - errcheck
          - gocyclo
          - gosec
          - noctx
          - unparam
      # Adapter helpers wrap http.Client.Do; bodyclose can't trace through
      # one indirection. The actual handlers DO close response bodies via
      # defer in convertOne / Convert.
      - path: internal/engine/(docling|kreuzberg|tika)/.*\.go
        linters:
          - bodyclose

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
