name: owui-cee-test

# Test stack: OpenWebUI + Docling + Kreuzberg + Tika + owui-cee-proxy.
# Ports are offset to avoid conflicts with other local stacks.

services:
  proxy:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
      args:
        VERSION: test
    image: owui-cee-proxy:test
    container_name: owui-cee-test-proxy
    depends_on:
      docling:
        condition: service_started
      kreuzberg:
        condition: service_started
      tika:
        condition: service_started
    environment:
      OWUI_PROXY_CONFIG: /app/config.yaml
    volumes:
      - ./test-proxy-config.yaml:/app/config.yaml:ro
    ports:
      - "28181:8080"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
    restart: unless-stopped

  docling:
    image: ghcr.io/docling-project/docling-serve:latest
    container_name: owui-cee-test-docling
    environment:
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "true"
      UVICORN_WORKERS: "1"
      DOCLING_SERVE_API_HOST: "0.0.0.0"
    ports:
      - "15001:5001"
    restart: unless-stopped

  kreuzberg:
    # The goldziher/* image predates the kreuzberg-dev rebrand and ships
    # without the email/.msg parsers; use the canonical GHCR image.
    image: ghcr.io/kreuzberg-dev/kreuzberg:latest
    container_name: owui-cee-test-kreuzberg
    ports:
      - "18001:8000"
    restart: unless-stopped

  tika:
    image: apache/tika:latest-full
    container_name: owui-cee-test-tika
    ports:
      - "19998:9998"
    restart: unless-stopped

  openwebui:
    image: ghcr.io/open-webui/open-webui:0.9.2
    container_name: owui-cee-test-openwebui
    depends_on:
      - proxy
    environment:
      WEBUI_AUTH: "false"
      CONTENT_EXTRACTION_ENGINE: "docling"
      DOCLING_SERVER_URL: "http://proxy:8080"
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "false"
    ports:
      - "13030:8080"
    restart: unless-stopped

networks:
  default:
    name: owui-cee-test
