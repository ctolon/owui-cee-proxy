name: owui-cee

services:
  proxy:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
      args:
        VERSION: dev
    image: owui-cee-proxy:dev
    container_name: owui-cee-proxy
    depends_on:
      redis:
        condition: service_healthy
      docling:
        condition: service_started
      tika:
        condition: service_started
      kreuzberg:
        condition: service_started
    environment:
      OWUI_PROXY_CONFIG: /app/config.yaml
      DOCLING_API_KEY: ""
      TIKA_API_KEY: ""
      KREUZBERG_API_KEY: ""
      REDIS_URL: redis://redis:6379/0
      PROXY_API_KEYS: ""
      OWUI_PROXY_OBSERVABILITY__LOG__LEVEL: info
    ports:
      - "8080:8080"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "/app/owui-cee-proxy", "-version"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: owui-cee-redis
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
    restart: unless-stopped

  docling:
    image: ghcr.io/docling-project/docling-serve:latest
    container_name: owui-cee-docling
    environment:
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "true"
      UVICORN_WORKERS: "1"
    ports:
      - "5001:5001"
    restart: unless-stopped

  tika:
    image: apache/tika:latest-full
    container_name: owui-cee-tika
    ports:
      - "9998:9998"
    restart: unless-stopped

  kreuzberg:
    image: ghcr.io/kreuzberg-dev/kreuzberg:latest
    container_name: owui-cee-kreuzberg
    ports:
      - "8000:8000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: owui-cee-prom
    profiles: ["observability"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: owui-cee-otel
    profiles: ["observability"]
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4318:4318"
    restart: unless-stopped

networks:
  default:
    name: owui-cee
