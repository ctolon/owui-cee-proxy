apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: owui-cee-proxy
spec:
  parentRefs:
    - name: owui-cee-gateway
  hostnames:
    - owui-cee-proxy.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: "300s"
        backendRequest: "300s"
      backendRefs:
        - name: owui-cee-proxy
          port: 80
