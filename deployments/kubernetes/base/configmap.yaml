apiVersion: v1
kind: ConfigMap
metadata:
  name: owui-cee-proxy
data:
  config.yaml: |
    server:
      listen: "0.0.0.0:8080"
      read_timeout: 30s
      max_body_bytes: 524288000
    routing:
      default_cee_engine: "docling"
      facade_path_prefix: "/v1"
    engines:
      docling:
        enable: true
        url: "http://docling-serve:5001"
        api_key_env: "DOCLING_API_KEY"
      tika:
        enable: true
        url: "http://tika:9998"
        api_key_env: "TIKA_API_KEY"
      kreuzberg:
        enable: true
        url: "http://kreuzberg:8000"
        api_key_env: "KREUZBERG_API_KEY"
    security:
      proxy_api_keys_env: "PROXY_API_KEYS"
      require_api_key: false
    observability:
      log:
        level: "info"
        format: "json"
      metrics:
        enabled: true
        path: "/metrics"
