apiVersion: v1
kind: ConfigMap
metadata:
  name: owui-cee-proxy
data:
  config.yaml: |
    server:
      listen: "0.0.0.0:8080"
      read_timeout: 30s
      max_body_bytes: 524288000
    routing:
      default_engine: "main-docling"
      facade:
        docling:
          enabled: true
          prefix: "/v1"
        external:
          enabled: true
          path: "/process"
      passthrough:
        enabled: true
    engines:
      main-docling:
        enable: true
        compat_type: "docling"
        url: "http://docling-serve:5001"
        api_key_env: "DOCLING_API_KEY"
        auth_header: "X-Api-Key"
        auth_scheme: "raw"
      fallback-kreuzberg:
        enable: false
        compat_type: "docling"
        url: "http://kreuzberg:8000"
        api_key_env: "KREUZBERG_API_KEY"
        auth_header: "Authorization"
        auth_scheme: "bearer"
    security:
      proxy_api_keys_env: "PROXY_API_KEYS"
      require_api_key: false
    observability:
      log:
        level: "info"
        format: "json"
      metrics:
        enabled: true
        path: "/metrics"
