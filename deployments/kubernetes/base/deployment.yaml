apiVersion: apps/v1
kind: Deployment
metadata:
  name: owui-cee-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: owui-cee-proxy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: owui-cee-proxy
    spec:
      serviceAccountName: owui-cee-proxy
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: docker.io/ctolon17/owui-cee-proxy:0.2.0
          imagePullPolicy: IfNotPresent
          args: ["-config", "/etc/owui-cee-proxy/config.yaml"]
          env:
            - name: OWUI_PROXY_CONFIG
              value: /etc/owui-cee-proxy/config.yaml
          envFrom:
            - secretRef:
                name: owui-cee-proxy-secrets
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/owui-cee-proxy
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: owui-cee-proxy
        - name: tmp
          emptyDir: {}
