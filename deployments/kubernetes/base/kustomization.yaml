apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: owui-cee
namePrefix: ""
commonLabels:
  app.kubernetes.io/name: owui-cee-proxy
  app.kubernetes.io/instance: owui-cee-proxy

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  # secret.example.yaml is INTENTIONALLY omitted from resources.
  # Apply it directly only as scaffolding for local clusters
  # (`kubectl apply -f secret.example.yaml`); a GitOps pipeline with
  # prune=true would otherwise materialise a live Secret with the
  # literal `REPLACE_ME` placeholder. Production operators supply real
  # values via SealedSecrets / ExternalSecrets generator patches.
  - deployment.yaml
  - service.yaml
  - pdb.yaml
