apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "owui-cee-proxy.fullname" . }}
  labels:
    {{- include "owui-cee-proxy.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "owui-cee-proxy.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "owui-cee-proxy.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "owui-cee-proxy.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Grace period for in-flight requests during pod termination.
      # Aligns with server.shutdown_grace in config so the Go process
      # finishes draining before SIGKILL fires.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 30 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: proxy
          image: {{ include "owui-cee-proxy.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "-config"
            - "/etc/owui-cee-proxy/config.yaml"
          env:
            - name: OWUI_PROXY_CONFIG
              value: "/etc/owui-cee-proxy/config.yaml"
          {{- if .Values.secrets.existingSecretName }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.existingSecretName }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Startup probe: tolerates up to ~60s of cold-start before
          # the readiness/liveness probes engage. Prevents readiness
          # flapping when the Go binary is still establishing engine
          # connections (TLS handshakes, breaker calibration).
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          # Graceful drain relies on terminationGracePeriodSeconds +
          # the Go server's SIGTERM handler (config.server.shutdown_
          # grace) — NOT a preStop hook. The earlier preStop ran
          # `["/bin/sh", "-c", "sleep 5"]` which fails on
          # gcr.io/distroless/static-debian12:nonroot (no shell)
          # → exec error → kubelet skips the delay → in-flight
          # requests receive RST during rolling updates.
          #
          # The Endpoints-removal-vs-SIGTERM race is mitigated
          # instead by giving terminationGracePeriodSeconds enough
          # headroom above server.shutdown_grace (defaults: 30s vs
          # 30s, equal so kubelet doesn't SIGKILL early). Operators
          # who need a longer drain window bump both knobs together.
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/owui-cee-proxy
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "owui-cee-proxy.fullname" . }}
        - name: tmp
          emptyDir: {}
