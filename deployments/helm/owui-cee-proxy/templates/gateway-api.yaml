{{- if .Values.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "owui-cee-proxy.fullname" . }}
  labels:
    {{- include "owui-cee-proxy.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.parentRef.name }}
      namespace: {{ .Values.gateway.parentRef.namespace }}
  hostnames:
    {{- range .Values.gateway.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: {{ .Values.gateway.timeouts.request }}
        backendRequest: {{ .Values.gateway.timeouts.backendRequest }}
      backendRefs:
        - name: {{ include "owui-cee-proxy.fullname" . }}
          port: {{ .Values.service.port }}
{{- end -}}
