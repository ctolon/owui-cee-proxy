{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "owui-cee-proxy.fullname" . }}
  labels:
    {{- include "owui-cee-proxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "owui-cee-proxy.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # ALWAYS allow port 8080 from the kubelet probe network.
    # Without this rule, enabling networkPolicy with the default
    # empty ingressFrom emits a zero-rule ingress block → full
    # deny → kubelet liveness/readiness probes 503 → pod
    # CrashLoopBackOff within ~30 s.
    #
    # The default selector targets the kube-system namespace
    # because every common CNI runs its kubelet probe path
    # through there; operators tighten via .Values.networkPolicy
    # .probeSources when they know their exact node-pool / CNI.
    - from:
        {{- toYaml (default (list (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" "kube-system")))) .Values.networkPolicy.probeSources) | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8080
    {{- with .Values.networkPolicy.ingressFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
  egress:
    - to:
        - namespaceSelector: {}
          podSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    {{- with .Values.networkPolicy.egressTo }}
    - to:
        {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end -}}
