replicaCount: 2

image:
  repository: docker.io/ctolon17/owui-cee-proxy
  tag: ""           # defaults to .Chart.AppVersion (0.0.2)
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532
  runAsNonRoot: true
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Performance budget (CLAUDE.md): 512 MiB ceiling under 100 concurrent
# requests of 10 MiB bodies. The request must reserve enough headroom
# for the kubelet not to OOM-kill the pod under realistic load —
# 128Mi WAS the historical default and routinely OOM-killed at ≥30
# concurrent uploads. 256Mi is the validated floor.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

# Pod-level grace period. Should match observability-relevant
# shutdown_grace in config; the Helm template substitutes this value
# verbatim into the Pod spec so kubelet waits before SIGKILL.
terminationGracePeriodSeconds: 30

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
  hosts:
    - host: owui-cee-proxy.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

gateway:
  enabled: false
  className: envoy
  parentRef:
    name: envoy-gateway
    namespace: envoy-gateway-system
  hostnames:
    - owui-cee-proxy.local
  timeouts:
    request: "300s"
    backendRequest: "300s"

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: false
  # probeSources is the ALWAYS-emitted ingress allow rule that keeps
  # kubelet probes (liveness/readiness/startup) reachable when the
  # policy is enabled. The chart's empty default ([]) resolves to a
  # kube-system namespaceSelector — the broadly safe choice. Tighten
  # in production by listing the exact node CIDR / namespace your
  # cluster's kubelet probe sources actually come from. Setting
  # probeSources to a non-empty list REPLACES the default; ingressFrom
  # is independent and stacks additively.
  probeSources: []
  # ingressFrom: extra allow rules layered ON TOP of probeSources.
  # Use for service-to-service ingress from sibling pods in the same
  # cluster. Example:
  #   ingressFrom:
  #     - namespaceSelector:
  #         matchLabels:
  #           name: openwebui
  #       podSelector:
  #         matchLabels:
  #           app: openwebui
  ingressFrom: []
  egressTo: []

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  # Prometheus Operator selects ServiceMonitor objects by label. The
  # most common production wiring is the kube-prometheus-stack release
  # name; override per-cluster (e.g., release: prometheus). Empty map
  # leaves the ServiceMonitor labelless — many Operator instances
  # will then SKIP it silently.
  labels:
    release: kube-prometheus

# ── application configuration ────────────────────────────────────────
config:
  server:
    listen: "0.0.0.0:8080"
    read_timeout: 30s
    read_header_timeout: 10s
    write_timeout: 0
    idle_timeout: 120s
    max_header_bytes: 1048576
    max_body_bytes: 524288000
    shutdown_grace: 30s
    http2: true
    h2c: false
    tls:
      enabled: false
      cert_file: ""
      key_file: ""
      min_version: "1.3"
      client_auth: "none"
      client_ca_file: ""
  routing:
    default_engine: "main-docling"
    facade:
      docling:
        enabled: true
        prefix: "/v1"
      external:
        enabled: true
        path: "/process"
    passthrough:
      enabled: true
  # User-defined engine map. Each entry's compat_type selects the
  # adapter (docling | external | docling-external | tika).
  engines:
    main-docling:
      enable: true
      compat_type: "docling"
      url: "http://docling-serve:5001"
      api_key_env: "DOCLING_API_KEY"
      auth_header: "X-Api-Key"
      auth_scheme: "raw"
      request_timeout: 120s
      health_path: "/health"
      mime_types: []
      # Per-engine overrides for observability.upstream defaults.
      # Uncomment any field to override; omitted fields inherit global.
      # observability:
      #   enabled: true
      #   body_snippet_bytes: 512
      #   level_4xx: "info"        # dial down for known-flaky backends
      #   level_5xx: "error"
      #   body_log_bytes: 0
    fallback-kreuzberg:
      enable: false
      compat_type: "docling"
      url: "http://kreuzberg:8000"
      api_key_env: "KREUZBERG_API_KEY"
      auth_header: "Authorization"
      auth_scheme: "bearer"
      health_path: "/health"
      mime_types:
        - "application/vnd.ms-outlook"
        - "message/rfc822"
  security:
    proxy_api_keys_env: "PROXY_API_KEYS"
    proxy_api_key_header: "X-Proxy-Api-Key"
    require_api_key: false
  ratelimit_global:
    rps: 200
    burst: 400
  tasks:
    enabled: false
    redis_url_env: "REDIS_URL"
    queue_concurrency: 16
    retention: 24h
    retry: 3
    result_ttl: 1h
  observability:
    log:
      level: "info"
      format: "json"
      # BurstSampler caps log volume at 5 events/level/sec. Enable when
      # debug-heavy outbound logging would otherwise saturate the log
      # pipeline; keep off in normal info-level operation.
      sampling: false
      add_caller: true
      # Timezone applied to log timestamps. Accepts IANA names, "UTC",
      # or "Local". Invalid values fall back to UTC with a stderr
      # warning. Example: "Europe/Istanbul".
      timezone: "UTC"
      # Timestamp serialisation. Aliases: RFC3339Nano (default), RFC3339,
      # unix, unix_ms, unix_micro. Any other value is treated as a Go
      # layout literal (e.g. "2006-01-02 15:04:05.000Z07:00").
      time_format: "RFC3339Nano"
      # Paths the AccessLog middleware skips entirely. Default empty
      # (log everything). Set this to mute readiness/health/metrics
      # probes if they dominate your log shipper.
      silence_paths: []
      # silence_paths: ["/healthz", "/readyz", "/metrics"]
      #
      # When true, the readiness handler marks every engine.Health()
      # probe context as silent — the instrumented HTTP transport
      # then drops its outbound_engine_request debug line for those
      # calls. Status / auth counters still fire.
      silence_engine_health: false
      # Remap zerolog's canonical field names to match your log
      # shipper's schema. Empty strings keep the upstream default.
      field_names: {}
      # field_names:
      #   level: severity        # GCP Cloud Logging convention
      #   message: msg
      #   timestamp: ts
      #
      # Static fields appended to EVERY log line via logger.With().
      # Use for service/env/pod identity stamps.
      static_fields: {}
      # static_fields:
      #   service: owui-cee-proxy
      #   env: prod
    metrics:
      enabled: true
      path: "/metrics"
    tracing:
      enabled: false
      otlp_endpoint: "http://otel-collector:4318"
      sample_ratio: 0.1
      service_name: "owui-cee-proxy"
    # Upstream-response observability: per-engine 4xx/5xx logging plus
    # the new engine_upstream_status / engine_auth_attached counters.
    # These are global defaults; each engine may override via
    # `engines.<name>.observability` (see below).
    upstream:
      enabled: true
      body_snippet_bytes: 256        # 0 to disable body snippet
      level_4xx: "warn"              # one of: trace debug info warn error
      level_5xx: "error"
      # body_log_bytes: outbound REQUEST body snippet captured by the
      # logging transport at DEBUG level. 0=off. WARNING: any value >0
      # writes upload contents to the log stream — set ONLY for an
      # ephemeral debugging session.
      body_log_bytes: 0

# Secrets are sourced from existing Secret(s); do NOT put values here.
secrets:
  existingSecretName: ""        # if set, mounted as envFrom
  envFromKeys: []               # optional explicit list of env keys to import
